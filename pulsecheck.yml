# UDNS UTM: uptime monitors, converted from the Upptime config of arian24b/utm.
# Docs for every key: https://github.com/arian24b/pulsecheck/wiki/YAML-Reference
# ${NAME} is filled from a GitHub secret of the same name (Settings → Secrets and variables → Actions).

notify:
  urls:
    - telegram://${TG_TOKEN}@telegram?chats=${TG_CHAT}
    # other services: https://github.com/arian24b/pulsecheck/wiki/Notifications
    # - ntfy://ntfy.sh/${NTFY_TOPIC}
  events: [down, up, degraded, ssl_warn]

defaults:
  max_response_ms: 10000   # Upptime "delay: 10000": slower than 10 s counts as down
  down_after: 2            # alert after 2 failed checks in a row (Upptime alerted on the first)
  interval: 5              # minutes between checks (the workflow runs every 5)
  ssl_warn_days: 14        # warn 14 days before a certificate expires

